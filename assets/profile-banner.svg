<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070B"/>
      <stop offset="35%" stop-color="#0E0C14"/>
      <stop offset="70%" stop-color="#14111D"/>
      <stop offset="100%" stop-color="#09080E"/>
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#E5A93C"/>
      <stop offset="50%" stop-color="#FDF0CD"/>
      <stop offset="75%" stop-color="#C58A24"/>
      <stop offset="100%" stop-color="#E5A93C"/>
    </linearGradient>
    <linearGradient id="goldCurveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFF1B8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8A6517" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldCurveSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996515" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#E5A93C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FDF0CD" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#32244C" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#1B142B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0D0917" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#996515" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textWhiteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="techGridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.08"/>
      <circle cx="40" cy="0" r="1" fill="#E5A93C" fill-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#bgGradient)"/>
  <rect width="1584" height="396" fill="url(#sunGlow)"/>
  <rect width="1584" height="396" fill="url(#techGridPattern)" opacity="0.8"/>
  <g id="abstract-geometry" transform="translate(1250, 198)">
    <circle cx="0" cy="0" r="210" fill="none" stroke="#E5A93C" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="150" fill="url(#sphereGrad)" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="190" ry="85" fill="none" stroke="url(#goldCurveGrad)" stroke-width="1.8" transform="rotate(-32)" stroke-opacity="0.7" filter="url(#goldGlowFilter)"/>
    <ellipse cx="0" cy="0" rx="225" ry="98" fill="none" stroke="#E5A93C" stroke-width="1" stroke-opacity="0.3" transform="rotate(-48)"/>
    <ellipse cx="0" cy="0" rx="140" ry="140" fill="none" stroke="#FFF1B8" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <line x1="-120" y1="-120" x2="120" y2="120" stroke="#E5A93C" stroke-width="1.2" stroke-opacity="0.25" transform="rotate(15)"/>
    <line x1="-150" y1="-50" x2="150" y2="50" stroke="#FFF1B8" stroke-width="1.5" stroke-opacity="0.35" transform="rotate(35)"/>
    <circle cx="95" cy="-75" r="4.5" fill="#FFF3B0" filter="url(#goldGlowFilter)"/>
    <circle cx="-110" cy="65" r="3" fill="#E5A93C" opacity="0.8"/>
  </g>
  <g id="golden-curves">
    <path d="M -50 370 Q 380 390, 780 270 T 1630 110" fill="none" stroke="url(#goldCurveSubtle)" stroke-width="2.5" opacity="0.6"/>
    <path d="M -20 325 C 320 325, 540 380, 820 280 C 1100 180, 1340 120, 1620 90" 
          fill="none" 
          stroke="url(#goldCurveGrad)" 
          stroke-width="3.2" 
          filter="url(#goldGlowFilter)"/>
    <path d="M 0 355 Q 600 370, 1050 210 T 1600 60" fill="none" stroke="#FFE082" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="900" y1="420" x2="1550" y2="-50" stroke="url(#goldLuxury)" stroke-width="1.8" stroke-opacity="0.45" stroke-dasharray="500 5"/>
    <line x1="1020" y1="440" x2="1620" y2="-20" stroke="#E5A93C" stroke-width="0.8" stroke-opacity="0.25"/>
  </g>
  <g id="sparkles" fill="#FFF1B8" opacity="0.65">
    <circle cx="180" cy="80" r="1.5"/>
    <circle cx="280" cy="160" r="1"/>
    <circle cx="720" cy="110" r="2" filter="url(#goldGlowFilter)"/>
    <circle cx="890" cy="240" r="1.5"/>
    <circle cx="1060" cy="95" r="2.5" filter="url(#goldGlowFilter)"/>
    <circle cx="1420" cy="290" r="1.5"/>
    <circle cx="1500" cy="180" r="2"/>
    <circle cx="640" cy="330" r="1"/>
  </g>
  <g id="text-content">
    <rect x="130" y="78" width="56" height="5" rx="2.5" fill="url(#goldLuxury)" filter="url(#goldGlowFilter)"/>
    <text x="128" y="152" 
          font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" 
          font-weight="900" 
          font-size="52" 
          fill="url(#textWhiteGlow)" 
          letter-spacing="3"
          style="text-transform: uppercase;">
      LUIZ MIGUEL
    </text>

    <text x="130" y="202" 
          font-family="'Montserrat', sans-serif" 
          font-weight="700" 
          font-size="21" 
          fill="url(#goldLuxury)" 
          letter-spacing="5"
          style="text-transform: uppercase;"
          filter="url(#goldGlowFilter)">
      FULL STACK DEVELOPER
    </text>

    <g id="tech-badges">
        <g transform="translate(130, 262)">
          <rect width="70" height="32" rx="16" fill="#15131C" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.2"/>
          <circle cx="14" cy="16" r="3.5" fill="#E5A93C" />
          <text x="24" y="20.5" font-family="'JetBrains Mono', 'Montserrat', monospace" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">JAVA</text>
        </g>
        <g transform="translate(212, 262)">
          <rect width="80.5" height="32" rx="16" fill="#15131C" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.2"/>
          <circle cx="14" cy="16" r="3.5" fill="#E5A93C" />
          <text x="24" y="20.5" font-family="'JetBrains Mono', 'Montserrat', monospace" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">REACT</text>
        </g>
        <g transform="translate(304.5, 262)">
          <rect width="91" height="32" rx="16" fill="#15131C" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.2"/>
          <circle cx="14" cy="16" r="3.5" fill="#E5A93C" />
          <text x="24" y="20.5" font-family="'JetBrains Mono', 'Montserrat', monospace" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">ORACLE</text>
        </g>
        <g transform="translate(407.5, 262)">
          <rect width="133" height="32" rx="16" fill="#15131C" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1.2"/>
          <circle cx="14" cy="16" r="3.5" fill="#E5A93C" />
          <text x="24" y="20.5" font-family="'JetBrains Mono', 'Montserrat', monospace" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">TYPESCRIPT</text>
        </g>
    </g>
  </g>
</svg>